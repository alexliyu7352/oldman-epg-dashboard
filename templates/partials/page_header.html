{% macro page_header(title, subtitle='', eyebrow='', actions='') %}
  <header class="flex flex-col gap-4 sm:flex-row sm:items-center sm:justify-between">
    <div>
      {% if eyebrow %}
        <p class="text-sm font-medium text-primary-600">{{ eyebrow }}</p>
      {% endif %}
      <h1 class="mt-1 text-xl font-semibold tracking-normal text-default-950 sm:text-2xl">{{ title }}</h1>
      {% if subtitle %}
        <p class="mt-2 max-w-2xl text-sm leading-6 text-default-600">{{ subtitle }}</p>
      {% endif %}
    </div>
    {% if actions %}
      <div class="flex flex-wrap gap-2">
        {{ actions | safe }}
      </div>
    {% endif %}
  </header>
{% endmacro %}

{% from "oldman/dashboard/partials/confirm.html" import confirm_body with context %}
{{ confirm_body(project.name, _("Delete this project and its fixture-owned tasks?"), icon="ri-delete-bin-line", wrapper_class="mb-4") }}
<form
  method="post"
  action="/examples/tables/projects/{{ project.id }}/delete"
  data-om-component="form"
  data-om-form
  data-om-form-mode="json"
>
  <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">
  <div data-om-form-message hidden></div>
  <p data-om-form-status role="status" aria-live="polite" hidden></p>
  <div class="flex justify-end gap-2">
    <button type="button" class="om-button om-button-secondary" data-om-modal-close>{{ _("Cancel") }}</button>
    <button type="submit" class="om-button om-button-danger">{{ _("Delete project") }}</button>
  </div>
</form>

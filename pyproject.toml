[project]
name = "oldman-epg-dashboard-example"
version = "0.1.0"
description = "EPG dashboard consumer application for the Oldman framework."
requires-python = ">=3.12, <3.14"
dependencies = [
    "oldman>=0.6.0,<0.7.0",
]

[dependency-groups]
dev = [
    "sanic-testing>=24.6",
]

[tool.uv]
package = false

[tool.oldman]
project_id = "327c6c3a-30e1-4d72-b60a-278de522f7d1"

# 与框架同一套约定。此前 demo 没有 lint 配置,import 顺序一类的问题全靠人眼。
[tool.ruff]
target-version = "py312"
line-length = 150
exclude = [".git", ".ruff_cache", "__pycache__", ".venv", "node_modules", "static"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

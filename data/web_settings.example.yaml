apps:
  - oldman.auth
  - oldman.apps.admin
  - oldman.web.messages.notifications
  - oldman.apps.roles
  - apps.accounts
  - apps.dashboard
  - apps.epg_admin
  - apps.examples
app_settings:
  auth:
    user_model: apps.accounts.models.User
  admin:
    require_superuser: false
  examples:
    http_base_url: https://httpbin.org
process:
  pid_dir: pids
web:
  listen_host: 127.0.0.1
  listen_port: 17997
  # 找回密码邮件这类在请求之外生成的链接用这个地址；改端口时一起改。
  domain: http://127.0.0.1:17997
  # 账户页面的地址:其余都用默认值。找回密码默认不装,这里打开它(登录页随之出现入口)。
  account:
    password_reset_url: /password-reset
  auto_reload: false
  workers: 1
  access_log: false
  response_timeout: 120
  request_timeout: 120
  keep_alive_timeout: 120
  real_ip_header: X-Real-IP
  websocket_max_size: 1048576
  websocket_ping_interval: 5
  websocket_ping_timeout: 20
  security:
    secret_key:
    csrf:
      ttl: 3600
      check_referer: true
      check_url: false
    fingerprint:
      # 示例页 /examples/security/fingerprint 用到；关掉它整站都不检查指纹。
      enabled: true
      # Demo 密钥：必须和前端构建期注入的那把一致（见 frontend/vite.config.ts）。
      # 真实部署换成自己的，并用 OLDMAN_FINGERPRINT_KEY 传给前端构建。
      aes_secret_key: b2xkbWFuLWVwZy1kZW1vLWZpbmdlcnByaW50LWtleSE=
      timestamp_max_diff: 300000
      rate_limits:
        default:
          window: 60
          fp_max: 20
          ip_max: 40
        /api/login:
          window: 300
          fp_max: 5
          ip_max: 10
        # 示例页专用的小额度，点几下就能看到 429。
        /examples/security/fingerprint/probe:
          window: 60
          fp_max: 5
          ip_max: 10
      max_fingerprints_per_ip: 5
      max_ips_per_fingerprint: 3
      blacklist_threshold: 5
      blacklist_duration: 3600
      violation_ttl: 3600
  session:
    enabled: true
    redis_alias: SESSION
    expiry: 86400
    cookie_name: oldman_session_id
    cookie_domain:
    cookie_httponly: true
    cookie_secure: false
    cookie_samesite: Lax
  # 「访问令牌」和「服务调用方」两个示例页要启用 jwt 与 api_key，形状如下。
  # 这里不给密钥：拿到 jwt.secret 就能签出任意用户（包括超级用户）的令牌，而这个文件是公开的。
  # 在自己的 data/web_settings.yaml 里取消注释，每个 secret 各用
  #   .venv/bin/python -c "import secrets; print(secrets.token_urlsafe(48))"
  # 生成一个。没有这段时两个示例页只显示启用方法。
  # auth:
  #   authenticators: [session, jwt, api_key]
  #   jwt:
  #     secret: <随机串，至少 32 个字符>
  #   api_keys:
  #     demo_script:
  #       secret: <另一个随机串>
  messages:
    enabled: true
  sse:
    enabled: true
    redis_alias: SSE
    heartbeat_interval: 15.0
    session_check_interval: 30.0
    queue_size: 100
    max_message_size: 65536
  template:
    dir: templates
  static:
    dir: static
    root: static
    url: /static
  media:
    storage: default
    url: /media/
  frontend:
    vite_dev_server_url: http://localhost:5173
database:
  url: sqlite+aiosqlite:///data/epg_dashboard.db
  echo: false
  enable_sql_logging: false
redis:
  # 框架内置别名：不指定连接的调用用它。
  DEFAULT:
    redis_url: redis://127.0.0.1:6379/3
  TASKIQ:
    redis_url: redis://127.0.0.1:6379/7
  CACHE:
    redis_url: redis://127.0.0.1:6379/2
  SESSION:
    redis_url: redis://127.0.0.1:6379/5
  SSE:
    redis_url: redis://127.0.0.1:6379/6
nats:
  # 框架内置别名：不指定连接的调用用它。
  DEFAULT:
    nats_url: nats://127.0.0.1:4222
  TASKIQ:
    nats_url: nats://127.0.0.1:4222
nats_bus:
  enabled: true
  nats_alias: TASKIQ
  namespace: epg_demo
  consume: false
  peer_id: web
taskiq:
  enabled: true
  namespace: epg_demo
  nats_alias: TASKIQ
  redis_alias: TASKIQ
storages:
  default:
    backend: oldman.storage.backends.filesystem.FileSystemStorage
    options:
      location: media
i18n:
  use_i18n: true
  use_i18n_path: false
  default_language: en
  languages:
    en:
      flag: us
    zh-Hans:
      flag: cn
    zh-Hant:
      flag: tw
core:
  app_name: oldman
  # The name people see (page brand, error pages, password reset mail); unset, app_name.
  site_name: Oldman
  # Every Redis key and channel of this service starts with it; app_name "oldman" is too generic to share a Redis with.
  namespace: oldman_epg_dashboard
  debug: false

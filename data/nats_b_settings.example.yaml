# Same receiving App and database, a different explicitly addressed peer.
apps:
  - oldman.auth
  - apps.accounts
  - apps.examples
  - apps.communication
app_settings:
  auth:
    user_model: apps.accounts.models.User
database:
  url: sqlite+aiosqlite:///data/epg_dashboard.db
process:
  pid_dir: pids
redis:
  # 框架内置别名：不指定连接的调用用它。
  DEFAULT:
    redis_url: redis://127.0.0.1:6379/3
  # 框架内置别名：settings sync 会补出它们，写在这里和其他地址一起改。
  CACHE:
    redis_url: redis://127.0.0.1:6379/2
  SESSION:
    redis_url: redis://127.0.0.1:6379/5
nats:
  # 框架内置别名：不指定连接的调用用它。
  DEFAULT:
    nats_url: nats://127.0.0.1:4222
  TASKIQ:
    nats_url: nats://127.0.0.1:4222
nats_bus:
  enabled: true
  nats_alias: TASKIQ
  namespace: epg_demo
  consume: true
  peer_id: monitor_b
taskiq:
  enabled: false
i18n:
  default_language: en

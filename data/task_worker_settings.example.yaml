# Copy to task_worker_settings.yaml; match Web's database, namespace and aliases.
core:
  # Web's namespace: the task cache this worker invalidates lives under it.
  namespace: oldman_epg_dashboard
apps:
  - oldman.auth
  - apps.auth
  - apps.examples
app_settings:
  auth:
    user_model: apps.auth.models.OldmanUser
database:
  url: sqlite+aiosqlite:///data/epg_dashboard.db
process:
  pid_dir: pids
nats:
  # 框架内置别名：不指定连接的调用用它。
  DEFAULT:
    nats_url: nats://127.0.0.1:4222
  TASKIQ:
    nats_url: nats://127.0.0.1:4222
nats_bus:
  enabled: true
  nats_alias: TASKIQ
  namespace: epg_demo
  consume: false
  peer_id: task_worker
redis:
  # 框架内置别名：不指定连接的调用用它。
  DEFAULT:
    redis_url: redis://127.0.0.1:6379/3
  TASKIQ:
    redis_url: redis://127.0.0.1:6379/7
taskiq:
  enabled: true
  namespace: epg_demo
  nats_alias: TASKIQ
  redis_alias: TASKIQ
  consume_queues: [reports, exports]
  workers: 2
  max_async_tasks: 3
  max_prefetch: 0
storages:
  default:
    backend: oldman.storage.backends.filesystem.FileSystemStorage
    options:
      location: media
i18n:
  default_language: en

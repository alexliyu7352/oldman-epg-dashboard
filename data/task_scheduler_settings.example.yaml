# Copy to task_scheduler_settings.yaml. Run only one Scheduler per namespace.
apps:
  - oldman.auth
  - apps.accounts
  - apps.examples
app_settings:
  auth:
    user_model: apps.accounts.models.User
database:
  url: sqlite+aiosqlite:///data/epg_dashboard.db
process:
  pid_dir: pids
nats:
  # 框架内置别名：不指定连接的调用用它。
  DEFAULT:
    nats_url: nats://127.0.0.1:4222
  TASKIQ:
    nats_url: nats://127.0.0.1:4222
nats_bus:
  enabled: true
  nats_alias: TASKIQ
  namespace: epg_demo
  consume: false
  peer_id: task_scheduler
redis:
  # 框架内置别名：不指定连接的调用用它。
  DEFAULT:
    redis_url: redis://127.0.0.1:6379/3
  TASKIQ:
    redis_url: redis://127.0.0.1:6379/7
  # 框架内置别名：settings sync 会补出它们，写在这里和其他地址一起改。
  CACHE:
    redis_url: redis://127.0.0.1:6379/2
  SESSION:
    redis_url: redis://127.0.0.1:6379/5
taskiq:
  enabled: true
  namespace: epg_demo
  nats_alias: TASKIQ
  redis_alias: TASKIQ
  schedule_update_interval: 5
i18n:
  default_language: en
